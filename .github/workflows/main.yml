name: CI - Build, Lint, Security Scan & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest pytest-cov

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Static security scan with Bandit
        run: bandit -r . -ll -ii

      - name: Start Flask application
        run: |
          python app.py &
          sleep 15

      - name: Dynamic security scan with OWASP ZAP
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://host.docker.internal:5000'
          fail_action: false

      - name: Run tests with pytest + coverage
        run: pytest --cov=. --cov-report=xml --verbose

      - name: Upload Bandit security report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml