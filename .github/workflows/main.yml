name: CI - Build, Lint, Security Scan & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest pytest-cov

      - name: Lint with flake8 (code style & basic errors)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings (GitHub editor is ~127 chars wide)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Static security scan with Bandit
        run: bandit -r . --format txt --output bandit-report.txt || true

      - name: Upload Bandit security report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.txt

      - name: Debug - show directory structure before tests
        run: |
          pwd
          ls -la
          ls -la tests/
          find . -name "*.py"

      - name: Run tests with pytest + coverage
        run: pytest --cov=. --cov-report=xml --verbose || echo "Pytest failed - see above"

      - name: Upload coverage report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
